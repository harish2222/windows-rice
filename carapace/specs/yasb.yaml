# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: yasb
description: Yet Another Status Bar for Windows
flags:
  -c, --config=: Path to config.yaml file
  -s, --styles=: Path to styles.css file
  -v, --version: Print version
  -h, --help: Print help
completion:
  flag:
    config:
      - $files
    styles:
      - $files
