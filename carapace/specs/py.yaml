# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: py
description: Python Launcher for Windows
flags:
  -2: Launch the latest Python 2.x version
  -3: Launch the latest Python 3.x version
  -3.14: Launch Python 3.14
  -3.13: Launch Python 3.13
  -3.12: Launch Python 3.12
  -3.11: Launch Python 3.11
  -3.10: Launch Python 3.10
  -0, --list: List the available Python runtimes
  -0p, --list-paths: List the available Python runtimes with their executable paths
  -c=: Program passed in as string
  -m=: Run library module as a script
  -i: Inspect interactively after running script
  -B: Do not write .pyc files on import
  -d: Turn on parser debugging output
  -E: Ignore PYTHON* environment variables
  -I: Isolate Python from the user's environment
  -O: Remove assert and __debug__-dependent statements
  -q: Do not print version and copyright messages on interactive startup
  -s: Do not add user site directory to sys.path
  -S: Do not imply 'import site' on initialization
  -u: Force stdout and stderr streams to be unbuffered
  -v: Verbose (trace import statements)
  -V: Print the Python version number and exit
  -h, --help: Print this help message and exit
completion:
  flag:
    m:
      - pip
      - venv
      - http.server
      - json.tool
      - unittest
      - timeit
      - pdb
      - cProfile
      - idlelib
      - asyncio
  positionalany:
    - $files
