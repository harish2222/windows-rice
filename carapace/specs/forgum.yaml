# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: forgum
description: cowsay + fortune + lolcat with a Rust ANSI animation engine
flags:
  --config=: Path to custom JSON, TOML, or YAML configuration file
  --reduce-motion: Disable animated motions and particle effects
  --text-only: Bypass ASCII cow art generation and print bubble text directly
  -f, --file=: Load full scene specification from a JSON file
  -c, --cow=: Animal mascot name to render
  --image=: Convert an image to ASCII art and use as mascot
  -h, --help: Print help
  -V, --version: Print version
completion:
  flag:
    config:
      - $files
    file:
      - $files
    image:
      - $files
    cow:
      - default
      - tux
      - dragon
      - stegosaurus
      - bunny
      - corgi
      - ghost
      - elephant
      - octopus
      - random
commands:
  - name: render
    description: Render a cow (default command)
  - name: think
    description: Render a thought bubble (cowthink mode)
  - name: fortune
    description: Print a random fortune to stdout
  - name: tui
    description: Launch the interactive terminal UI & studio
  - name: list
    description: List available options in structured tables
    completion:
      positional:
        - ["animals", "effects", "scenery", "colors", "shells"]
  - name: init
    description: Generate shell integration hooks
    completion:
      positional:
        - ["powershell", "bash", "zsh", "fish", "nu", "xonsh"]
  - name: completions
    description: Generate shell completion scripts
    completion:
      positional:
        - ["powershell", "bash", "zsh", "fish", "nu"]
  - name: channel
    description: View, switch, or manage release channels
    completion:
      positional:
        - ["stable", "nightly", "dev"]
  - name: checkhealth
    description: Run comprehensive health check on environment
  - name: doctor
    description: Diagnose terminal capabilities and configuration
  - name: demo
    description: Run the showcase demo
  - name: showcase
    description: Run the 60-second showcase demo reel
  - name: say
    description: Run a command and render its output in a cow speech bubble
  - name: timer
    description: Time a command and show duration in a cow popup
  - name: battle
    description: ASCII cow jousting battle between two mascots
  - name: rps-battle
    description: Interactive Rock Paper Scissors mascot battle
  - name: sweep
    description: Emergency recovery command to restore terminal
  - name: stop
    description: Stop any running animation or daemon
  - name: image
    description: Convert an image to ASCII art
    completion:
      positional:
        - ["$files"]
