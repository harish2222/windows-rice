# Title -: uvx Carapace Completion Specification
# ============================================================================
# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: uvx
description: Run a command provided by a Python package in an ephemeral environment
flags:
  --from=: Use the given package to provide the command
  -w, --with=: Run with the given packages installed
  --with-editable=: Run with the given packages installed in editable mode
  --with-requirements=: Run with the packages listed in the given files
  -c, --constraints=: Constrain versions using given requirements files
  --isolated: Run tool in an isolated virtual environment
  --env-file=: Load environment variables from a .env file
  --no-env-file: Avoid reading environment variables from a .env file
  --python=: Python version or implementation to use
  --torch-backend=: Backend for PyTorch ecosystem (auto, cpu, cu126, cu124, rocm6.2)
  -v, --verbose: Enable verbose output
  -q, --quiet: Do not print progress or informational output
  -V, --version: Display uvx version
  -h, --help: Print help
completion:
  flag:
    env-file:
      - $files
    with-requirements:
      - $files
    torch-backend:
      - auto
      - cpu
      - cu126
      - cu124
      - cu121
      - cu118
      - rocm6.2
  positionalany:
    - $files
