# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: agy
description: Antigravity CLI agentic coding tool
flags:
  -c, --continue: Continue the most recent conversation
  -p, --print: Run a single prompt non-interactively
  -i, --prompt-interactive: Run an initial prompt interactively
  --agent=: Agent for current CLI session
  --model=: Model for current CLI session
  --mode=: Set agent execution mode (auto, plan, accept-edits)
  --effort=: Reasoning effort (low, medium, high, xhigh, max)
  --dangerously-skip-permissions: Auto-approve all tool permission requests
  --sandbox: Run in a sandbox with terminal restrictions
  --conversation=: Resume a previous conversation by ID
  --project=: Project ID or name
  --new-project: Create a new project for this session
commands:
  - name: mcp
    description: Manage MCP servers
    commands:
      - name: add
        description: Add an MCP server
      - name: remove
        description: Remove an MCP server
      - name: list
        description: List configured MCP servers
      - name: enable
        description: Enable an MCP server
      - name: disable
        description: Disable an MCP server
  - name: models
    description: List available models
  - name: agents
    description: List available agents
  - name: plugin
    description: Manage plugins
    commands:
      - name: list
        description: List installed plugins
      - name: install
        description: Install a plugin
      - name: uninstall
        description: Uninstall a plugin
  - name: update
    description: Update CLI
  - name: changelog
    description: Show changelog and release notes
