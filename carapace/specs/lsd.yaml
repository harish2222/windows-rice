# Project -: Window-Rice
# Title -: lsd Carapace Completion Specification
# ============================================================================
# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: lsd
description: An ls command with pretty colors and icons
flags:
  -a, --all: Do not ignore entries starting with .
  -A, --almost-all: Do not list implied . and ..
  --color=: When to use terminal colours
  --icon=: When to print the icons
  --icon-theme=: Whether to use fancy or unicode icons
  -F, --classify: Append indicator at the end of the file names
  -l, --long: Display extended file metadata as a table
  --ignore-config: Ignore the configuration file
  --config-file=: Provide a custom lsd configuration file
  -1, --oneline: Display one entry per line
  -R, --recursive: Recurse into directories
  -h, --human-readable: Format sizes in human-readable units
  --tree: Recurse into directories and present as a tree
  --depth=: Stop recursing after reaching specified depth
  -d, --directory-only: Display directories themselves
  --permission=: How to display permissions
  --size=: How to display size
  --total-size: Display the total size of directories
  --date=: How to display date
  -t, --timesort: Sort by time modified
  -S, --sizesort: Sort by size
  -X, --extensionsort: Sort by file extension
  -G, --gitsort: Sort by git status
  -v, --versionsort: Natural sort of numbers
  --sort=: Sort by TYPE instead of name
  -U, --no-sort: Do not sort
  -r, --reverse: Reverse the order of the sort
  --group-dirs=: Sort the directories then the files
  --group-directories-first: Groups directories at the top before files
  --blocks=: Specify the blocks that will be displayed
  --classic: Enable classic mode (similar to ls)
  -I, --ignore-glob=: Glob pattern to ignore
  -i, --inode: Display the index number of each file
  -g, --git: Show git status
  -L, --dereference: Follow symlinks
  -V, --version: Print version
  --help: Print help
completion:
  flag:
    color:
      - always
      - auto
      - never
    icon:
      - always
      - auto
      - never
    icon-theme:
      - fancy
      - unicode
    permission:
      - rwx
      - octal
      - attributes
      - disable
    size:
      - default
      - short
      - bytes
    sort:
      - size
      - time
      - version
      - extension
      - git
      - none
    group-dirs:
      - none
      - first
      - last
    config-file:
      - $files
  positionalany:
    - $files
    - $directories
