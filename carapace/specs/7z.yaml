# ============================================================================
# Author -: HKDEVS
# Project -: Window-Rice
# Title -: 7z Carapace Completion Specification
# ============================================================================
# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: 7z
description: High compression ratio file archiver
flags:
  -aoa: Overwrite All existing files without prompt
  -aos: Skip extracting of existing files
  -aou: Auto rename extracting file
  -aot: Auto rename existing file
  -an: Disable archive_name field
  -bb0: Minimal log level
  -bb1: Normal log level
  -bb2: File names log level
  -bb3: Full detailed log level
  -bd: Disable progress indicator
  -bt: Show execution time statistics
  -mmt=: Set number of CPU threads
  -mx=: Set compression level (1 fastest to 9 ultra)
  -o=: Set output directory
  -p=: Set password
  -r: Recurse subdirectories
  -sdel: Delete files after compression
  -sfx: Create SFX archive
  -si: Read data from stdin
  -slt: Show technical information for list command
  -so: Write data to stdout
  -spe: Eliminate duplication of root folder for extract command
  -spf: Use fully qualified file paths
  -ssc: Set sensitive case mode
  -ssw: Compress shared files
  -y: Assume Yes on all queries
completion:
  flag:
    o:
      - $directories
    mx:
      - "1"
      - "3"
      - "5"
      - "7"
      - "9"
  positional:
    - ["a", "b", "d", "e", "h", "i", "l", "rn", "t", "u", "x"]
    - ["$files"]
  positionalany:
    - $files
    - $directories
commands:
  - name: a
    description: Add files to archive
  - name: x
    description: eXtract files with full paths
  - name: e
    description: Extract files from archive without directory names
  - name: l
    description: List contents of archive
  - name: t
    description: Test integrity of archive
  - name: d
    description: Delete files from archive
  - name: u
    description: Update files to archive
  - name: b
    description: Run benchmark
  - name: h
    description: Calculate hash values for files
  - name: rn
    description: Rename files in archive
