# Title -: yq Carapace Completion Specification
# ============================================================================
# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: yq
description: Portable command-line YAML, JSON, XML, CSV, TOML, and properties processor
flags:
  -C, --colors: Force print with colors
  --csv-auto-parse: Parse CSV YAML/JSON values
  --csv-separator=: CSV Separator character
  -e, --exit-status: Set exit status if there are no matches or null/false is returned
  --expression=: Forcibly set the expression argument
  --from-file=: Load expression from specified file
  -f, --front-matter=: Process first input as yaml front-matter (extract|process)
  -I, --indent=: Sets indent level for output
  -i, --inplace: Update the file in place of first file given
  -p, --input-format=: Parse format for input
  -M, --no-colors: Force print with no colors
  -N, --no-doc: Do not print document separators (---)
  -0, --nul-output: Use NUL char to separate values
  -n, --null-input: Don't read input, evaluate expression from scratch
  -o, --output-format=: Output format type
  -P, --prettyPrint: Pretty print output
  --unwrapScalar: Unwrap scalar results
  -v, --version: Print version
  -h, --help: Help for yq
completion:
  flag:
    input-format:
      - auto
      - yaml
      - json
      - props
      - csv
      - tsv
      - xml
      - toml
      - hcl
      - lua
      - ini
    output-format:
      - auto
      - yaml
      - json
      - props
      - csv
      - tsv
      - xml
      - toml
      - hcl
      - shell
      - lua
      - ini
    from-file:
      - $files
  positionalany:
    - $files
commands:
  - name: eval
    aliases: ["e"]
    description: Apply expression to each document in each yaml file in sequence
    flags:
      -i, --inplace: Update file in place
      -P, --prettyPrint: Pretty print
    completion:
      positionalany:
        - $files
  - name: eval-all
    aliases: ["ea"]
    description: Loads all documents of all yaml files and runs expression once
    flags:
      -i, --inplace: Update file in place
      -P, --prettyPrint: Pretty print
    completion:
      positionalany:
        - $files
