# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: moc
description: Qt Meta Object Compiler
flags:
  -h, --help: Displays help on commandline options
  --help-all: Displays help including generic Qt options
  -v, --version: Displays version information
  -o=: Write output to file rather than stdout
  -I=: Add directory to the include path
  -F=: Add Mac framework to the include path
  -E: Preprocess only, do not generate meta object code
  -D=: Define macro with optional definition
  -U=: Undefine macro
  -M=: Add key/value pair to plugin meta data
  --compiler-flavor=: Set the compiler flavor
  -i: Do not generate an #include statement
  -p=: Path prefix for included file
  -f=: Force #include file, overwrite default
  -b=: Prepend #include file, preserve default include
  --include=: Parse file as an #include before the main sources
  -n=: Do not display notes (-nn) or warnings (-nw)
  --no-notes: Do not display notes
  --no-warnings: Do not display warnings
  --ignore-option-clashes: Ignore options that conflict with compilers
  --output-json: Create a machine-readable JSON file alongside output
  --output-dep-file: Output a Make-style dep file
  --dep-file-path=: Path where to write the dep file
  --dep-file-rule-name=: Rule name of the dep file
  --require-complete-types: Require complete types for better performance
  --collect-json: Collect previously generated JSON output into a single file
completion:
  flag:
    o:
      - $files
    I:
      - $directories
    dep-file-path:
      - $files
    include:
      - $files
  positionalany:
    - $files
