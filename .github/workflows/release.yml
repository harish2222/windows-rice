# ============================================================================
# Author -: HKDEVS
# Project -: Window-Rice
# Title -: Windows Rice Release Packaging Workflow
# ============================================================================
name: Release Rice Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch snapshot

      - name: Run installer unit tests (release gate)
        run: cargo test --manifest-path installer/Cargo.toml --verbose

      - name: Build release binary
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Package installer archive
        shell: pwsh
        run: |
          $releaseDir = "release-package"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "installer/target/release/rice-installer.exe" "$releaseDir\rice-installer.exe"
          Copy-Item "install.ps1" "$releaseDir\install.ps1"
          Copy-Item "README.md" "$releaseDir\README.md" -ErrorAction SilentlyContinue

          Compress-Archive -Path "$releaseDir\*" -DestinationPath "rice-installer-windows-x64.zip" -Force
          $sha = (Get-FileHash -Path "rice-installer-windows-x64.zip" -Algorithm SHA256).Hash
          "$sha  rice-installer-windows-x64.zip" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          $shaExe = (Get-FileHash -Path "installer\target\release\rice-installer.exe" -Algorithm SHA256).Hash
          "$shaExe  rice-installer.exe" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii -Append
          $shaScript = (Get-FileHash -Path "$releaseDir\install.ps1" -Algorithm SHA256).Hash
          "$shaScript  install.ps1" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii -Append

          Write-Host "Archive created: rice-installer-windows-x64.zip"
          Write-Host "SHA256: $sha"

      - name: Determine tag name
        id: get_tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            "${{ github.event.inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.0.0" }
          # validate release tag shape before it reaches the release step
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "::error::tag_name '$tag' does not match expected pattern vX.Y.Z"
            exit 1
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Windows Rice Release ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            rice-installer-windows-x64.zip
            installer/target/release/rice-installer.exe
            install.ps1
            SHA256SUMS.txt
