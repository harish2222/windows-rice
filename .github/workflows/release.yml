# ============================================================================
# Author -: HKDEVS
# Project -: Window-Rice
# Title -: Windows Rice Release Packaging Workflow
# ============================================================================
name: Release Rice Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch snapshot

      - name: Run installer unit tests (release gate)
        run: cargo test --manifest-path installer/Cargo.toml --verbose

      - name: Build release binary
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Smoke-gate installer binary (--help must work)
        shell: pwsh
        run: |
          # The release artifact must actually start and print its banner before
          # we publish it as the bootstrap's integrity-verified payload.
          $out = & "installer\target\release\rice-installer.exe" --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "WINDOW-RICE INSTALLER") {
            Write-Host "::error::rice-installer.exe --help smoke gate failed (exit $LASTEXITCODE)"
            Write-Host $out
            exit 1
          }
          Write-Host "[PASS] rice-installer.exe --help smoke gate" -ForegroundColor Green

      - name: Package installer archive
        shell: pwsh
        run: |
          $releaseDir = "release-package"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "installer/target/release/rice-installer.exe" "$releaseDir\rice-installer.exe"
          Copy-Item "install.ps1" "$releaseDir\install.ps1"
          Copy-Item "README.md" "$releaseDir\README.md" -ErrorAction SilentlyContinue

          Compress-Archive -Path "$releaseDir\*" -DestinationPath "rice-installer-windows-x64.zip" -Force

          # Deterministic checksum manifest: write the bytes directly instead of
          # piping through Out-File (formatting/width rules have mangled hash
          # lines before), then FAIL the release if any expected line is absent -
          # install.ps1's integrity gate parses the rice-installer.exe line and
          # silently skips verification when it cannot find it.
          $entries = @(
            @("rice-installer-windows-x64.zip", "rice-installer-windows-x64.zip"),
            @("installer\target\release\rice-installer.exe", "rice-installer.exe"),
            @("$releaseDir\install.ps1", "install.ps1")
          )
          $lines = foreach ($e in $entries) {
            $hash = (Get-FileHash -Path $e[0] -Algorithm SHA256).Hash
            "$hash  $($e[1])"
          }
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) "SHA256SUMS.txt"), $lines, [System.Text.UTF8Encoding]::new($false))

          $manifest = Get-Content "SHA256SUMS.txt" -Raw
          foreach ($name in "rice-installer-windows-x64.zip", "rice-installer.exe", "install.ps1") {
            if ($manifest -notmatch ("[0-9a-fA-F]{64}\s+" + [regex]::Escape($name))) {
              Write-Host "::error::SHA256SUMS.txt is missing the $name line - bootstrap integrity check would silently skip"
              exit 1
            }
          }

          # The shipped bootstrap entry point must parse before it is published.
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error file=install.ps1::line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }

          Write-Host "Archive created: rice-installer-windows-x64.zip"
          Write-Host "SHA256SUMS.txt verified (3 asset lines); install.ps1 parses cleanly"

      - name: Determine tag name
        id: get_tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            "${{ github.event.inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.0.0" }
          # validate release tag shape before it reaches the release step
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "::error::tag_name '$tag' does not match expected pattern vX.Y.Z"
            exit 1
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Windows Rice Release ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            rice-installer-windows-x64.zip
            installer/target/release/rice-installer.exe
            install.ps1
            SHA256SUMS.txt
