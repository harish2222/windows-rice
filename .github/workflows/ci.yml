# Project -: Window-Rice
# Title -: Windows Rice Continuous Integration Workflow
# ============================================================================
name: Windows Rice CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-installer:
    name: Build & Test Rust TUI Installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch snapshot

      - name: Cache Cargo build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            installer/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('installer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust installer
        run: cargo check --manifest-path installer/Cargo.toml

      - name: Run installer unit tests
        run: cargo test --manifest-path installer/Cargo.toml --verbose

      - name: Run YASB workspace unit tests
        if: matrix.os == 'windows-latest'
        run: cargo test --manifest-path yasb/Cargo.toml --verbose

      - name: Build release binary
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Upload installer artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rice-installer-windows-x64
          path: installer/target/release/rice-installer.exe
          if-no-files-found: error

  validate-configs:
    name: Validate Shell & Terminal Configs
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate PowerShell Profiles AST Syntax
        shell: pwsh
        run: |
          $profiles = @(
            "install.ps1",
            "shells/powershell/profile.ps1",
            "shells/powershell/Microsoft.PowerShell_profile.ps1",
            "powershell/profile.ps1",
            "powershell/Microsoft.PowerShell_profile.ps1"
          )
          $allPassed = $true
          foreach ($p in $profiles) {
            if (Test-Path $p) {
              $tokens = $null
              $errors = $null
              $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                Write-Host "::error file=$p::AST Parse errors detected ($($errors.Count))"
                $errors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" }
                $allPassed = $false
              } else {
                Write-Host "[PASS] $p - 0 parse errors" -ForegroundColor Green
              }
            }
          }
          if (-not $allPassed) { exit 1 }

      - name: Guard Against Command-Mode Operator Parameters
        shell: pwsh
        run: |
          # Regression gate for the v1.0.4 sandbox bootstrap abort:
          #   elseif (Test-Path $x -and (...))
          # parses cleanly but binds `-and` as a PARAMETER of Test-Path
          # (NamedParameterNotFound), which $ErrorActionPreference='Stop'
          # turns into a hard abort of `irm ... | iex`. AST parse-error checks
          # cannot see it - only an operator-named CommandParameterAst scan.
          $targets = @("install.ps1")
          $targets += (Get-ChildItem -Path "tools","tests","docker","yasb\tools","yasb\configs","komorebi" -Recurse -Filter "*.ps1" -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $targets += (Get-ChildItem -Path "shells\powershell","windows-powershell" -Filter "*.ps1" -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $failed = $false
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { continue }
            $tokens = $null; $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $t), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { continue }  # parse errors reported by the AST step
            $bad = @($ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.CommandParameterAst] -and
              $node.ParameterName -match '^(and|or|not|xor)$'
            }, $true))
            if ($bad.Count -gt 0) {
              $failed = $true
              foreach ($b in $bad) {
                Write-Host "::error file=$t::line $($b.Extent.StartLineNumber): logical operator '$($b.ParameterName)' bound as a command parameter (NamedParameterNotFound abort)"
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "[PASS] $($targets.Count) first-party scripts: no operator-named command parameters" -ForegroundColor Green

      - name: Validate Carapace Completion Specs
        shell: pwsh
        run: |
          if (-not (Get-Command carapace -ErrorAction SilentlyContinue)) {
            try {
              $carapaceZip = "$env:TEMP\carapace.zip"
              Invoke-RestMethod -Uri "https://github.com/carapace-sh/carapace-bin/releases/latest/download/carapace-bin_windows_amd64.zip" -OutFile $carapaceZip -TimeoutSec 10
              Expand-Archive -Path $carapaceZip -DestinationPath "$env:TEMP\carapace-bin" -Force
              $env:PATH += ";$env:TEMP\carapace-bin"
            } catch {
              Write-Host "Notice: carapace binary not downloaded, falling back to schema check: $_"
            }
          }
          $specs = Get-ChildItem -Path "carapace/specs" -Filter "*.yaml"
          Write-Host "Validating $($specs.Count) Carapace completion specs..." -ForegroundColor Cyan
          $failed = 0
          foreach ($s in $specs) {
            if (Get-Command carapace -ErrorAction SilentlyContinue) {
              $res = carapace --codegen $s.FullName 2>&1
              if ($LASTEXITCODE -ne 0 -or ($res -match "Error:")) {
                Write-Host "::error file=$($s.FullName)::$res"
                $failed++
              }
            } else {
              try {
                $content = Get-Content $s.FullName -Raw
                if ([string]::IsNullOrWhiteSpace($content) -or -not ($content -match "name:")) {
                  Write-Host "::error file=$($s.FullName)::Missing name in completion spec"
                  $failed++
                }
              } catch {
                Write-Host "::error file=$($s.FullName)::Failed to read spec: $_"
                $failed++
              }
            }
          }
          if ($failed -gt 0) {
            Write-Host "Failed specs count: $failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "All $($specs.Count) Carapace specs validated successfully!" -ForegroundColor Green

      - name: Validate JSON & TOML Configuration Files
        shell: pwsh
        run: |
          # 1. Validate Windows Terminal settings JSON
          $wtPath = "windows-terminal/settings.json"
          if (Test-Path $wtPath) {
            $json = Get-Content $wtPath -Raw | ConvertFrom-Json
            if ($null -eq $json.profiles) {
              Write-Host "::error file=$wtPath::Missing profiles in Windows Terminal settings"
              exit 1
            }
            Write-Host "[PASS] $wtPath JSON valid" -ForegroundColor Green
          }

          # 2. Validate Fastfetch config
          $ffPath = "fastfetch/config.jsonc"
          if (Test-Path $ffPath) {
            Write-Host "[PASS] $ffPath detected" -ForegroundColor Green
          }

          # 3. Validate Alacritty TOML
          $alacrittyPath = "alacritty/alacritty.toml"
          if (Test-Path $alacrittyPath) {
            $content = Get-Content $alacrittyPath -Raw
            if (-not ($content -match "\[window\]") -or -not ($content -match "Agave Nerd Font Mono")) {
              Write-Host "::error file=$alacrittyPath::Missing window or Agave font configuration"
              exit 1
            }
            Write-Host "[PASS] $alacrittyPath valid" -ForegroundColor Green
          }

          # 4. Validate WezTerm Lua
          $weztermPath = "wezterm/wezterm.lua"
          if (Test-Path $weztermPath) {
            $content = Get-Content $weztermPath -Raw
            if (-not ($content -match "Agave Nerd Font Mono") -or -not ($content -match "maximize")) {
              Write-Host "::error file=$weztermPath::Missing Agave font or maximize configuration"
              exit 1
            }
            Write-Host "[PASS] $weztermPath valid" -ForegroundColor Green
          }

  e2e-suite:
    name: E2E Multi-Tier Suite (Tiers 1-4)
    needs: rust-installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch snapshot

      - name: Cache Cargo build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            installer/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('installer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build installer binaries (debug + release)
        run: |
          cargo build --manifest-path installer/Cargo.toml
          cargo build --release --manifest-path installer/Cargo.toml

      - name: Install carapace completer
        shell: pwsh
        run: |
          # carapace assets are versioned; resolve the real name via the API
          # instead of guessing a stable-name release asset (which 404s).
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/carapace-sh/carapace-bin/releases/latest" -TimeoutSec 120
          $asset = $rel.assets | Where-Object { $_.name -match '^carapace-bin_[0-9\.]+_windows_amd64\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            Write-Host "::error::no carapace-bin windows_amd64 asset in latest release"
            exit 1
          }
          Write-Host "Fetching $($asset.name)"
          $carapaceZip = "$env:TEMP\carapace.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $carapaceZip -TimeoutSec 300
          Expand-Archive -Path $carapaceZip -DestinationPath "$env:TEMP\carapace-bin" -Force
          $exe = Get-ChildItem "$env:TEMP\carapace-bin" -Recurse -Filter "carapace.exe" | Select-Object -First 1
          if ($exe) {
            $binDir = Split-Path -Parent $exe.FullName
            "CARGO_CARAPACE_DIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "carapace available at $binDir"
          } else {
            Write-Host "::error::carapace.exe not found inside the downloaded archive"
            exit 1
          }

      - name: Run E2E suite (tiers 1-4)
        shell: pwsh
        run: |
          $env:PATH = "${{ env.CARGO_CARAPACE_DIR }};$env:PATH"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File "tests/e2e/run_all.ps1" -Tier All
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::E2E suite reported failures"
            exit 1
          }
