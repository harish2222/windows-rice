# ============================================================================
# Author -: HKDEVS
# Project -: Window-Rice
# Title -: Music Player Daemon Configuration
# ============================================================================
# =============================================================================
#  MPD 0.24.x — Windows 11 (WASAPI)
#  Docs: https://mpd.readthedocs.io/en/stable/user.html
#        https://man.archlinux.org/man/mpd.conf.5.en (0.24.x)
#
#  Start:  mpd --no-daemon "C:/Users/haris/.config/mpd/mpd.conf"
#  Test:   mpd --no-daemon --stdout --verbose "C:/Users/haris/.config/mpd/mpd.conf"
#
#  kew and cliamp are standalone players (they do not speak the MPD protocol);
#  MPD is the separate daemon for MPD clients (mpc, ncmpc, mpDris2, ...).
# =============================================================================

# ---- Library ---------------------------------------------------------------
music_directory    "C:/Users/haris/Music"
playlist_directory "C:/Users/haris/.local/share/mpd/playlists"
db_file            "C:/Users/haris/.cache/mpd/database"
state_file         "C:/Users/haris/.cache/mpd/state"
sticker_file        "C:/Users/haris/.cache/mpd/sticker.sql"

# ---- Logging ---------------------------------------------------------------
log_file "C:/Users/haris/.cache/mpd/log"

# ---- Networking ------------------------------------------------------------
# Local-only listener; do not expose MPD to the LAN.
bind_to_address "127.0.0.1"
port "6600"
zeroconf_enabled "no"

# ---- Behaviour -------------------------------------------------------------
# auto_update is Linux-only; use `mpc update` after adding files.
auto_update "no"
restore_paused "yes"
filesystem_charset "UTF-8"

# Loudness war: honour album ReplayGain tags, never clip.
replaygain "album"
replaygain_preamp "0.0"
replaygain_missing_preamp "0.0"
replaygain_limit "yes"
volume_normalization "no"

# ---- Audio output ----------------------------------------------------------
# WASAPI shared mode on the default device: no exclusive lock, other apps can
# still make sound. Omit `device` to use the Windows default endpoint.
audio_output {
    type            "wasapi"
    name            "Windows WASAPI (default)"
    exclusive       "no"
}

# ---- Decoders / inputs -----------------------------------------------------
# FLAC is native; FFmpeg covers the rest of the collection.
decoder {
    plugin          "flac"
    enabled         "yes"
}

decoder {
    plugin          "ffmpeg"
    enabled         "yes"
}

input {
    plugin          "curl"
    enabled         "yes"
}
