# ============================================================================
#  GlazeWM configuration — Catppuccin Mocha, alt-based, BSP tiling
#  Config path: %userprofile%\.glzr\glazewm\config.yaml
#  Theme matches YASB Catppuccin Mocha bar.
#  Modifiers: Alt (primary), Shift, Ctrl.  Windows key left free for the OS.
# ============================================================================

general:
  startup_commands:
    - "shell-exec yasb"
    - "shell-exec pwsh -NoProfile -Command \"Stop-Process -Name whkd -ErrorAction SilentlyContinue\""
  # KEY-ONLY MODE: Komorebi owns focus + cursor (mouse_follows_focus) and all
  # tiling, so GlazeWM must not touch cursor or focus. Both managers moving
  # the cursor caused focus flicker / cursor war.
  focus_follows_cursor: false
  workspace_behavior: "workspace_driven"
  cursor_jump:
    enabled: false
    trigger: "window_focus"

gaps:
  # KEY-ONLY MODE: GlazeWM manages zero windows (ignore-all rule), so these are
  # inert — kept at 0 to match komorebi's zero-gap setup if that ever changes.
  inner_gap: "0px"
  outer_gap:
    top: "0px"
    right: "0px"
    bottom: "0px"
    left: "0px"

window_behavior:
  default_orientation: "horizontal"
  # KEY-ONLY MODE: Komorebi draws all borders (4px, focused #cba6f7). GlazeWM
  # borders off to avoid double 8px frames on every window.
  border:
    enabled: false
    width: "4px"
    color: "#313244"
    focused_color: "#cba6f7"
    unfocused_color: "#313244"

bar:
  height: "0"
  opacity: 0.0
  background: "#00000000"
  foreground: "#00000000"
  font_family: ""
  font_size: "1"
  padding: "0 0 0 0"
  components_left: []
  components_right: []

ignore:
  class_names:
    - "SnippingToolWindowClass"
    - "ScreenSketch"
    - "MS_SnipSketch"
    - "Windows.UI.Core.CoreWindow"

workspaces:
  - name: "1"
  - name: "2"
  - name: "3"
  - name: "4"
  - name: "5"
  - name: "6"
  - name: "7"
  - name: "8"
  - name: "9"

window_rules:
  # Ignore EVERYTHING: GlazeWM manages zero windows (stays unpaused so every
  # hotkey stays live). Komorebi owns all tiling. An empty match entry
  # matches every window.
  - commands: ["ignore"]
    match: [{}]
    on: ["manage"]
    run_once: true

binding_modes:
  - name: "resize"
    keybindings:
      - commands: ["shell-exec silent-run komorebic resize-edge left decrease"]
        bindings: ["h", "left"]
      - commands: ["shell-exec silent-run komorebic resize-edge right increase"]
        bindings: ["l", "right"]
      - commands: ["shell-exec silent-run komorebic resize-edge top increase"]
        bindings: ["k", "up"]
      - commands: ["shell-exec silent-run komorebic resize-edge bottom increase"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter", "alt+r"]

keybindings:
  # NOTE: GlazeWM is the HOTKEY LAYER only here. It stays unpaused (paused mode
  # would deafen all keys) but manages zero windows via the ignore-all rule
  # below. Komorebi owns tiling/BSP/workspaces. WM actions shell out to
  # komorebic through silent-run (no console flash); GUI launchers use paths.
  # ── Focus (alt + hjkl / arrows) ────────────────────────────────────────────
  - commands: ["shell-exec silent-run komorebic focus left"]
    bindings: ["alt+h", "alt+left"]
  - commands: ["shell-exec silent-run komorebic focus right"]
    bindings: ["alt+l", "alt+right"]
  - commands: ["shell-exec silent-run komorebic focus up"]
    bindings: ["alt+k", "alt+up"]
  - commands: ["shell-exec silent-run komorebic focus down"]
    bindings: ["alt+j", "alt+down"]

  # ── Move (alt + shift + hjkl / arrows) ─────────────────────────────────────
  - commands: ["shell-exec silent-run komorebic move left"]
    bindings: ["alt+shift+h", "alt+shift+left"]
  - commands: ["shell-exec silent-run komorebic move right"]
    bindings: ["alt+shift+l", "alt+shift+right"]
  - commands: ["shell-exec silent-run komorebic move up"]
    bindings: ["alt+shift+k", "alt+shift+up"]
  - commands: ["shell-exec silent-run komorebic move down"]
    bindings: ["alt+shift+j", "alt+shift+down"]

  # ── Resize binding mode ─────────────────────────────────────────────────────
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["alt+r"]

  # ── Window state (komorebi) ────────────────────────────────────────────────
  - commands: ["shell-exec silent-run komorebic toggle-maximize"]
    bindings: ["win+f"]
  - commands: ["shell-exec silent-run komorebic toggle-float"]
    bindings: ["win+shift+f"]
  - commands: ["shell-exec silent-run komorebic toggle-tiling"]
    bindings: ["alt+t"]
  - commands: ["shell-exec silent-run komorebic minimize"]
    bindings: ["alt+m"]
  - commands: ["shell-exec silent-run komorebic close"]
    bindings: ["alt+q", "alt+x"]

  # ── i3 layouts, stacking & focus layers ────────────────────────────────────
  # i3 split h/v has no komorebi equivalent (BSP auto-alternates splits;
  # Alt+Shift+V flip-layout is the manual control). Everything else maps:
  - commands: ["shell-exec silent-run komorebic cycle-layout next"]
    bindings: ["alt+d"]
  - commands: ["shell-exec silent-run komorebic cycle-layout previous"]
    bindings: ["alt+shift+d"]
  - commands: ["shell-exec silent-run komorebic stack up"]
    bindings: ["alt+w"]
  - commands: ["shell-exec silent-run komorebic cycle-stack next"]
    bindings: ["alt+u"]
  - commands: ["shell-exec silent-run komorebic unstack"]
    bindings: ["alt+shift+u"]
  - commands: ["shell-exec silent-run komorebic promote"]
    bindings: ["alt+p"]
  - commands: ["shell-exec silent-run komorebic toggle-workspace-layer"]
    bindings: ["alt+o"]
  - commands: ["shell-exec silent-run komorebic toggle-monocle"]
    bindings: ["alt+shift+m"]

  # ── WM control (komorebi; glazewm itself stays up as the key layer) ─────────
  - commands: ["shell-exec silent-run komorebic stop"]
    bindings: ["alt+shift+e"]
  - commands: ["shell-exec silent-run komorebic replace-configuration C:\\Users\\haris\\komorebi.json"]
    bindings: ["alt+shift+r"]
  - commands: ["shell-exec silent-run komorebic retile"]
    bindings: ["alt+shift+w"]
  - commands: ["shell-exec silent-run komorebic toggle-pause"]
    bindings: ["alt+shift+p"]
  - commands: ["shell-exec silent-run komorebic cycle-focus next"]
    bindings: ["alt+semicolon"]

  # ── Workspaces (alt + 1-9 focus, komorebi is 0-indexed) ─────────────────────
  - commands: ["shell-exec silent-run komorebic focus-workspace 0"]
    bindings: ["alt+1"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 1"]
    bindings: ["alt+2"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 2"]
    bindings: ["alt+3"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 3"]
    bindings: ["alt+4"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 4"]
    bindings: ["alt+5"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 5"]
    bindings: ["alt+6"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 6"]
    bindings: ["alt+7"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 7"]
    bindings: ["alt+8"]
  - commands: ["shell-exec silent-run komorebic focus-workspace 8"]
    bindings: ["alt+9"]

  # Move window to workspace + follow.
  - commands: ["shell-exec silent-run komorebic move-to-workspace 0", "shell-exec silent-run komorebic focus-workspace 0"]
    bindings: ["alt+shift+1"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 1", "shell-exec silent-run komorebic focus-workspace 1"]
    bindings: ["alt+shift+2"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 2", "shell-exec silent-run komorebic focus-workspace 2"]
    bindings: ["alt+shift+3"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 3", "shell-exec silent-run komorebic focus-workspace 3"]
    bindings: ["alt+shift+4"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 4", "shell-exec silent-run komorebic focus-workspace 4"]
    bindings: ["alt+shift+5"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 5", "shell-exec silent-run komorebic focus-workspace 5"]
    bindings: ["alt+shift+6"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 6", "shell-exec silent-run komorebic focus-workspace 6"]
    bindings: ["alt+shift+7"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 7", "shell-exec silent-run komorebic focus-workspace 7"]
    bindings: ["alt+shift+8"]
  - commands: ["shell-exec silent-run komorebic move-to-workspace 8", "shell-exec silent-run komorebic focus-workspace 8"]
    bindings: ["alt+shift+9"]

  # Cycle active workspaces.
  - commands: ["shell-exec silent-run komorebic cycle-workspace previous"]
    bindings: ["alt+ctrl+left"]
  - commands: ["shell-exec silent-run komorebic cycle-workspace next"]
    bindings: ["alt+ctrl+right"]

  # Move workspace to another monitor.
  - commands: ["shell-exec silent-run komorebic cycle-move-workspace-to-monitor previous"]
    bindings: ["alt+shift+ctrl+left"]
  - commands: ["shell-exec silent-run komorebic cycle-move-workspace-to-monitor next"]
    bindings: ["alt+shift+ctrl+right"]
  - commands: ["shell-exec silent-run komorebic cycle-move-workspace-to-monitor previous"]
    bindings: ["alt+shift+ctrl+up"]
  - commands: ["shell-exec silent-run komorebic cycle-move-workspace-to-monitor next"]
    bindings: ["alt+shift+ctrl+down"]

  # ── Launchers ──────────────────────────────────────────────────────────────
  # Shell: Nushell directly
  - commands: ["shell-exec nu"]
    bindings: ["alt+return"]

  # PowerShell 7 (pwsh)
  - commands: ["shell-exec pwsh"]
    bindings: ["win+return"]

  # Zellij (pwsh inside)
  - commands: ["shell-exec zellij new-session --layout default -c ~/.config/zellij/config.kdl shell pwsh"]
    bindings: ["win+shift+return"]

  # Xonsh
  - commands: ["shell-exec xonsh"]
    bindings: ["alt+shift+return"]

  # Editor: VS Code
  - commands: ["shell-exec code"]
    bindings: ["alt+v"]
  # Browser: Arc (Store alias needs cmd /c start)
  - commands: ["shell-exec cmd /c start arc"]
    bindings: ["alt+a"]
  # Browser: Brave (full path, not on PATH)
  # Direct path via 8.3 short name (no spaces, so no quoting needed).
  # Proven by lexer tests: double quotes = "no ending" error, single quotes =
  # "not valid" error, .lnk target = reload hang. Quoteless exe is the only form.
  - commands: ["shell-exec C:\\PROGRA~1\\BRAVES~1\\BRAVE-~1\\APPLIC~1\\brave.exe"]
    bindings: ["alt+b"]
  # Browser: Zen (full path, not on PATH)
  # Desktop Zen.lnk points here; direct short path avoids shell entirely
  - commands: ["shell-exec C:\\Users\\haris\\AppData\\Local\\ZENBRO~1\\zen.exe"]
    bindings: ["alt+z"]
  # Editor: Emacs (full path, not on PATH)
  - commands: ["shell-exec C:\\PROGRA~1\\Emacs\\emacs-31.1\\bin\\runemacs.exe"]
    bindings: ["alt+e"]

  # ── Screenshots ────────────────────────────────────────────────────────────
  - commands: ["shell-exec SnippingTool.exe"]
    bindings: ["alt+print_screen"]
  # Native Win+Shift+S overlay via URI (quoteless, silent-run for zero flash)
  - commands: ["shell-exec silent-run explorer ms-screenclip:"]
    bindings: ["win+shift+s"]

  # Quoteless via -encodedcommand (base64 UTF-16LE): same SendKeys action
  - commands: ["shell-exec silent-run powershell -encodedcommand JgAgAHsAQQBkAGQALQBUAHkAcABlACAALQBBAHMAcwBlAG0AYgBsAHkATgBhAG0AZQAgAFMAeQBzAHQAZQBtAC4AVwBpAG4AZABvAHcAcwAuAEYAbwByAG0AcwA7ACAAWwBTAHkAcwB0AGUAbQAuAFcAaQBuAGQAbwB3AHMALgBGAG8AcgBtAHMALgBTAGUAbgBkAEsAZQB5AHMAXQA6ADoAUwBlAG4AZABXAGEAaQB0ACgAJwAlAHsAUABSAFQAUwBDAH0AJwApAH0A"]
    bindings: ["alt+shift+print_screen"]

  # ── Media keys (volume) ────────────────────────────────────────────────────
  - commands: ["shell-exec silent-run powershell -encodedcommand KABOAGUAdwAtAE8AYgBqAGUAYwB0ACAALQBDAG8AbQBPAGIAagBlAGMAdAAgAFcAUwBjAHIAaQBwAHQALgBTAGgAZQBsAGwAKQAuAFMAZQBuAGQASwBlAHkAcwAoAFsAYwBoAGEAcgBdADEANwA1ACkA"]
    bindings: ["alt+ctrl+F3"]
  - commands: ["shell-exec silent-run powershell -encodedcommand KABOAGUAdwAtAE8AYgBqAGUAYwB0ACAALQBDAG8AbQBPAGIAagBlAGMAdAAgAFcAUwBjAHIAaQBwAHQALgBTAGgAZQBsAGwAKQAuAFMAZQBuAGQASwBlAHkAcwAoAFsAYwBoAGEAcgBdADEANwA0ACkA"]
    bindings: ["alt+ctrl+F2"]
  - commands: ["shell-exec silent-run powershell -encodedcommand KABOAGUAdwAtAE8AYgBqAGUAYwB0ACAALQBDAG8AbQBPAGIAagBlAGMAdAAgAFcAUwBjAHIAaQBwAHQALgBTAGgAZQBsAGwAKQAuAFMAZQBuAGQASwBlAHkAcwAoAFsAYwBoAGEAcgBdADEANwAzACkA"]
    bindings: ["alt+ctrl+F1"]

  # ── Brightness ─────────────────────────────────────────────────────────────
  - commands: ["shell-exec silent-run powershell -encodedcommand "]
    bindings: ["alt+shift+F3"]
  - commands: ["shell-exec silent-run powershell -encodedcommand "]
    bindings: ["alt+shift+F2"]


