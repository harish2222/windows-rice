[package]
name = "keybind"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "keybind"
path = "src/main.rs"

[dependencies]
yasb-theme = { path = "../theme/yasb-theme" }
yasb-chrome = { path = "../chrome/yasb-chrome" }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
