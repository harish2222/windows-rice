[package]
name = "mandala-gen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mandala-gen"
path = "src/main.rs"

[dependencies]
# Shared stylesheet parsing and colour parsing, so the generator reads the
# same 22 theme blocks and palette tokens the switcher and picker do.
yasb-theme = { path = "../yasb-theme" }

# PNG encode/decode — comes from the local cargo cache, no network needed.
png = "0.17"
