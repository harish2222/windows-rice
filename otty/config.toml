# =============================================================================
#  Otty 1.6.x configuration - Windows 11
#  Reference: https://docs.otty.sh/reference/configuration
#
#  Only flat, documented keys are used here. Otty silently ignores unknown keys
#  ("gpu_acceleration", "material", "blur", "line-height" are NOT config keys —
#  they live inside .ottytheme files).
#
#  Frosted glass: the theme `catppuccin-mocha-glass` asks the XAML compositor
#  for `acrylic-thin` on the window frame and `acrylic` on the chrome columns.
#  A previous setup put `material = "acrylic"` on the whole window and that
#  crashed the compositor on this build, so the thin variant is used instead.
# =============================================================================

# --- Theme -------------------------------------------------------------------
theme = "catppuccin-mocha-glass"
theme-dark = "catppuccin-mocha-glass"
auto-theme-dark-mode = false

# --- Shell -------------------------------------------------------------------
# `command` is the documented shell key for panes launched without a profile.
# Windows windows opened from a profile use that profile's `shell` instead
# (see profiles/18dfa98576390b5000000000.toml -> Nushell).
command = "nu"
working-directory = "inherit"

# --- Fonts -------------------------------------------------------------------
font-family = "Agave Nerd Font Mono"
font-family-bold = "Agave Nerd Font Mono"
font-family-italic = "Agave Nerd Font Mono"
font-family-bold-italic = "Agave Nerd Font Mono"
font-size = 15
font-ligatures = "calt"
windows-text-rendering = "natural"

# --- Cursor ------------------------------------------------------------------
cursor-style = "underline"
cursor-style-blink = "always_off"
cursor-color = "#f5e0dc"

# --- Window / performance ----------------------------------------------------
# Acrylic is supplied by the theme's [windows] material block; window-opacity is kept
# at 1.0 so the OS compositor does not create a raw alpha hole over the desktop,
# while background-opacity at 0.92 gives neutral frosted glass blur without wallpaper bleed.
background-opacity = 0.92
window-opacity = 1.0
window-size = "remember"
scrollback-lines = 50000
session-log-size-mb = 10
max-fps = 120
freeze-inactive-tab = true

# --- Session behaviour -------------------------------------------------------
# A clean window each launch; restore is what made startup feel like a hang.
on-launch = "new_window"
session-restore-processes = "none"
session-restore-banner = false
quit-after-last-window-closed = true

# --- Input, selection & clipboard -------------------------------------------
mouse-hide-while-typing = true
copy-on-select = true
clipboard-paste-protection = true

# --- Shell integration & frecency -------------------------------------------
shell-integration = true
omit-otty-prefix = true
zoxide-enabled = true
frecency-auto-record = true

# --- App chrome --------------------------------------------------------------
language = "english"
auto-hide-tabs-panel = "auto"
editor-visible-whitespace = true
# term = "xterm-ghostty" (reset to default)

# --- Catppuccin Mocha palette -------------------------------------------------
foreground = "#cdd6f4"
background = "#1e1e2e"
palette-0 = "#45475a"
palette-1 = "#f38ba8"
palette-2 = "#a6e3a1"
palette-3 = "#f9e2af"
palette-4 = "#89b4fa"
palette-5 = "#f5c2e7"
palette-6 = "#94e2d5"
palette-7 = "#bac2de"
palette-8 = "#585b70"
palette-9 = "#f38ba8"
palette-10 = "#a6e3a1"
palette-11 = "#f9e2af"
palette-12 = "#89b4fa"
palette-13 = "#f5c2e7"
palette-14 = "#94e2d5"
palette-15 = "#a6adc8"

# --- Profiles ----------------------------------------------------------------
profile = "18dfa98576390b5000000000"
profile = "18dfa985769e6d9c00000001"
profile = "18dfa98576ec04e400000002"
profile = "18dfa9857738af7400000003"
