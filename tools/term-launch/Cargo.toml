[package]
name = "term-launch"
version = "0.1.0"
edition = "2021"
description = "Window-Rice maximized+focused terminal launcher"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
]

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
